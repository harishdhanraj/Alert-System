name: Favorites Stock Alert

on:
  schedule:
    # Fires at :30 past the hour, 13:30-22:30 UTC, Mon-Fri.
    # That window covers 9:30am-5pm ET across BOTH EDT (UTC-4) and EST (UTC-5).
    # run_favorites_alert.py double-checks the real US/Eastern clock and
    # exits immediately for any run that lands outside 9:30am-5pm ET,
    # so a couple of "extra" wake-ups near the DST edges are harmless.
    - cron: '30 13-22 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit back alert_state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run favorites alert scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python run_favorites_alert.py

      - name: Persist alert state (so we don't re-alert next hour)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --quiet --cached || git commit -m "Update alert state [skip ci]"
          git push
